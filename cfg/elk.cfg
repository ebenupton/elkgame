# The scroll demo: one 16K sideways RAM image (&8000-&BFFF) and the keyboard routine,
# which must run from main RAM (&0900) because reading the keyboard pages ROM 8 over
# the sideways bank.  ld65 runs in the build directory (see the Makefile).
#
# Code whose timing is counted must not cross a page where a branch or indexed access
# would then cost a cycle more.  Loop 1 (LOOP) and the delay tails (TAILS) each sit in
# one page (asserted in the source).  The window's code (LOOP2) starts a page: its line
# blocks are 64-byte slots, four to a page.  The window's variants share a page with
# VX (VARIANTS: the exit patches a vector's low byte).  DLOOP is page-aligned so that
# CODE starts 8 bytes into a page, where no branch in the fixed-length work crosses
# one (tools/pagecheck.py).  TABLES3 holds tables that must share a page.  NSTORE (the
# vertical step's stores, fixed length) starts a page, so that its loops stay in one.
# VCODE holds variable-length code (the trajectory, the vertical step's plan), whose
# page crossings do not matter, out of CODE's way.
MEMORY {
	SW:   start = $8000, size = $4000, file = "elk.bin";
	KBDM: start = $0900, size = $0100, file = "kbd.bin", fill = yes;
}
SEGMENTS {
	ENTRY:    load = SW, type = ro;
	LOOP:     load = SW, type = ro;
	LOOP2:    load = SW, type = ro, align = $100;
	TAILS:    load = SW, type = ro;
	VARIANTS: load = SW, type = ro, align = $100;
	DLOOP:    load = SW, type = ro, align = $100;
	CODE:     load = SW, type = ro;
	TABLES:   load = SW, type = ro, align = $100;
	TABLES2:  load = SW, type = ro, align = $100;
	TABLES4:  load = SW, type = ro;
	TABLES3:  load = SW, type = ro, align = $100;
	NSTORE:   load = SW, type = ro, align = $100;
	VCODE:    load = SW, type = ro;
	VARS:     load = SW, type = rw, align = $100;
	KBDCODE:  load = KBDM, type = ro;
}
